<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - KODA Meubles</title>
  <meta name="description"
    content="Connectez-vous à votre compte KODA Meubles pour accéder à vos commandes, à votre liste de souhaits, et plus encore.">
  <link rel="stylesheet" href="../styles/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

  <main class="auth-page">

    <div class="auth-split" style="min-height: auto;">
      <div class="auth-form-side">
        <div class="auth-form-container">
          <div class="back-link">
            <a href="../index.html">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="m15 18-6-6 6-6" />
              </svg>
              RETOUR À LA BOUTIQUE
            </a>
          </div>

          <h1 class="auth-heading">Bon retour</h1>
          <p class="auth-subheading">Connectez-vous à votre compte pour continuer vos achats</p>

          <form class="auth-form" id="login-form">
            <div class="auth-field">
              <label for="login-email">Adresse E-mail</label>
              <input type="email" id="login-email" name="email" placeholder="vous@exemple.com" required
                autocomplete="email">
            </div>
            <div class="auth-field">
              <label for="login-password">Mot de passe</label>
              <div class="auth-password-wrap">
                <input type="password" id="login-password" name="password" placeholder="Entrez votre mot de passe"
                  required autocomplete="current-password">
                <button type="button" class="auth-toggle-pw" id="toggle-password" aria-label="Afficher le mot de passe">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
              </div>
            </div>
            <button type="submit" class="auth-submit-btn" id="login-submit">Se Connecter</button>
          </form>

          <p class="auth-switch">Vous n'avez pas de compte ? <a href="signup.html">Créer un compte</a></p>
        </div>
      </div>
      <div class="auth-image-side">
        <img src="../images/images-pages/login-image.jpg" alt="Modern elegant interior design">
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../javascript/supabase-init.js"></script>
  <script src="../javascript/navbar.js"></script>
  <script src="../javascript/footer.js"></script>
  <script src="../javascript/cart.js"></script>
  <script src="../javascript/auth.js"></script>
  <script src="../javascript/chatbot.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initNavbar();
      initFooter();
      initChatbot();
      initAuth();
    });
  </script>
</body>

</html>
