<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produit - KODA Meubles</title>
  <link rel="preconnect" href="https://opmrbxjwfmtaxsujzysv.supabase.co">
  <link rel="stylesheet" href="../styles/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>


  <main class="product-page">
    <div class="product-container">
      <div class="back-link">
        <a href="products-list.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6" />
          </svg>
          RETOUR AUX PRODUITS
        </a>
      </div>

      <div class="product-layout">
        <div class="product-image-container">
          <img src="" alt="">
        </div>

        <div class="product-details">
          <div class="breadcrumb">
            <span>Accueil</span>
            <span>/</span>
            <span></span>
          </div>

          <h1 class="product-title"></h1>
          <p class="product-price"></p>

          <p class="product-desc"></p>

          <div class="product-actions">
            <div class="qty-control" id="product-qty-control">
              <button type="button" class="qty-btn qty-minus" aria-label="Diminuer la quantité">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
              </button>
              <span class="qty-value" id="product-quantity">1</span>
              <button type="button" class="qty-btn qty-plus" aria-label="Augmenter la quantité">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="12" y1="5" x2="12" y2="19" />
                  <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
              </button>
            </div>
            <button class="add-to-cart-btn">AJOUTER AU PANIER</button>
          </div>

          <div class="product-specs">
            <div class="spec-row">
              <h4>Dimensions</h4>
              <p></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../javascript/supabase-init.js"></script>
  <script src="../javascript/cart.js"></script>
  <script src="../javascript/load-data.js"></script>
  <script src="../javascript/navbar.js"></script>
  <script src="../javascript/footer.js"></script>
  <script src="../javascript/product-page.js"></script>
  <script src="../javascript/chatbot.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initNavbar();
      initFooter();
      initChatbot();
      initProductPage();
    });
  </script>
</body>

</html>
